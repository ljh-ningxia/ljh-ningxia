<svg xmlns="http://www.w3.org/2000/svg" width="880" height="460" viewBox="0 0 880 460" role="img" aria-label="个人主页首屏">
  <style>
    svg {
    --bg: #FAFAF9;
    --panel: #F3F4F6;
    --border: #D0D7DE;
    --text: #1F2328;
    --muted: #656D76;
    --accent: #0550AE;
    --green: #116329;
    --purple: #6639BA;
    --amber: #7D4E00;
    --red: #A40E26;
    --cyan: #0F6E75;
    }
    @media (prefers-color-scheme: dark) {
      svg {
    --bg: #0D1117;
    --panel: #161B22;
    --border: #30363D;
    --text: #E6EDF3;
    --muted: #8B949E;
    --accent: #58A6FF;
    --green: #3FB950;
    --purple: #BC8CFF;
    --amber: #D29922;
    --red: #FF7B72;
    --cyan: #39C5CF;
      }
    }
  </style>
  <rect x="0.5" y="0.5" width="879" height="459" rx="10" fill="var(--bg)" stroke="var(--border)"/>
  <path d="M0.5 42 V10.5 A10 10 0 0 1 10.5 0.5 H869.5 A10 10 0 0 1 879.5 10.5 V42 Z" fill="var(--panel)"/>
  <line x1="0.5" y1="42.5" x2="879.5" y2="42.5" stroke="var(--border)"/>
  <circle cx="26" cy="31" r="5.5" fill="#FF5F57"/><circle cx="45" cy="31" r="5.5" fill="#FEBC2E"/><circle cx="64" cy="31" r="5.5" fill="#28C840"/>
  <text x="440.0" y="35" fill="var(--muted)" font-size="12" text-anchor="middle">ljh-ningxia@github — zsh</text>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Microsoft YaHei','PingFang SC','Noto Sans SC',monospace" font-size="14">
    <text x="26" y="104" fill="var(--text)" font-size="32" font-weight="700" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Microsoft YaHei','PingFang SC','Noto Sans SC',monospace">你好，我是 ljh-ningxia</text>
    <text x="26" y="128" fill="var(--muted)" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Microsoft YaHei','PingFang SC','Noto Sans SC',monospace">人工智能 / 数据 · 在校学生 · 公开学习</text>
    <text x="26" y="146" xml:space="preserve"><tspan fill="var(--muted)"># </tspan><tspan fill="var(--green)" font-weight="600">whoami</tspan><tspan fill="var(--muted)">  →  </tspan><tspan fill="var(--text)">一名学 AI 的学生</tspan></text>
    <text x="26" y="172" xml:space="preserve"> </text>
    <text x="26" y="198" xml:space="preserve"><tspan fill="var(--green)" font-weight="600">$ </tspan><tspan fill="var(--text)">cat 简介.txt</tspan></text>
    <text x="26" y="224" xml:space="preserve"><tspan fill="var(--muted)">  在读      </tspan><tspan fill="var(--text)"> · </tspan><tspan fill="var(--accent)" font-weight="600">计算机科学</tspan></text>
    <text x="26" y="250" xml:space="preserve"><tspan fill="var(--muted)">  方向      </tspan><tspan fill="var(--text)"> · </tspan><tspan fill="var(--accent)" font-weight="600">人工智能</tspan><tspan fill="var(--muted)"> 与 </tspan><tspan fill="var(--accent)" font-weight="600">数据</tspan></text>
    <text x="26" y="276" xml:space="preserve"><tspan fill="var(--muted)">  状态      </tspan><tspan fill="var(--text)"> · </tspan><tspan fill="var(--amber)">公开学习，一次一个 commit</tspan></text>
    <text x="26" y="302" xml:space="preserve"> </text>
    <text x="26" y="328" xml:space="preserve"><tspan fill="var(--green)" font-weight="600">$ </tspan><tspan fill="var(--text)">cat 座右铭.txt</tspan></text>
    <text x="26" y="354" xml:space="preserve"><tspan fill="var(--muted)">  「 </tspan><tspan fill="var(--cyan)">先跑起来，再跑对，最后跑快。</tspan><tspan fill="var(--muted)"> 」</tspan></text>
    <text x="26" y="380" xml:space="preserve"> </text>
    <text x="26" y="406" xml:space="preserve"><tspan fill="var(--green)" font-weight="600">$ </tspan><tspan fill="var(--green)" font-weight="600">▊</tspan></text>
  </g>
</svg>
