<svg xmlns="http://www.w3.org/2000/svg" width="414" height="176" viewBox="0 0 414 176" role="img" aria-label="data-cookbook">
  <style>
    svg {
    --bg: #FAFAF9;
    --panel: #F3F4F6;
    --border: #D0D7DE;
    --text: #1F2328;
    --muted: #656D76;
    --accent: #0550AE;
    --green: #116329;
    --purple: #6639BA;
    --amber: #7D4E00;
    --red: #A40E26;
    --cyan: #0F6E75;
    }
    @media (prefers-color-scheme: dark) {
      svg {
    --bg: #0D1117;
    --panel: #161B22;
    --border: #30363D;
    --text: #E6EDF3;
    --muted: #8B949E;
    --accent: #58A6FF;
    --green: #3FB950;
    --purple: #BC8CFF;
    --amber: #D29922;
    --red: #FF7B72;
    --cyan: #39C5CF;
      }
    }
  </style>
  <rect x="0.5" y="0.5" width="413" height="175" rx="8" fill="var(--bg)" stroke="var(--border)"/>
  <line x1="1" y1="1" x2="413" y2="1" stroke="var(--green)" stroke-width="2" stroke-linecap="round"/>
  <g font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono','Courier New',monospace">
  <text x="22" y="34" fill="var(--muted)" font-size="12">[04]</text>
  <text x="60" y="34" fill="var(--text)" font-size="14" font-weight="600">data-cookbook</text>
  <text x="22" y="62" fill="var(--muted)" font-size="12.5">Personal recipes for the boring-but-</text>
  <text x="22" y="81" fill="var(--muted)" font-size="12.5">vital parts of data work: cleaning,</text>
  <text x="22" y="100" fill="var(--muted)" font-size="12.5">joins gone wrong, schema drift, SQL.</text>
  <rect x="22" y="125" width="37" height="20" rx="4" fill="var(--panel)" stroke="var(--border)"/>
  <text x="30" y="139" fill="var(--accent)" font-size="11">SQL</text>
  <rect x="65" y="125" width="58" height="20" rx="4" fill="var(--panel)" stroke="var(--border)"/>
  <text x="73" y="139" fill="var(--accent)" font-size="11">Pandas</text>
  <rect x="129" y="125" width="37" height="20" rx="4" fill="var(--panel)" stroke="var(--border)"/>
  <text x="137" y="139" fill="var(--accent)" font-size="11">dbt</text>
  <text x="392" y="139" fill="var(--green)" font-size="11" text-anchor="end">● wip</text>
  </g>
</svg>
